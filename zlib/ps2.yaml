project: zlib

targets:
  - name: z
    type: ee_lib
    sources:
      - src/adler32.c
      - src/compress.c
      - src/crc32.c
      - src/deflate.c
      - src/gzclose.c
      - src/gzlib.c
      - src/gzread.c
      - src/gzwrite.c
      - src/inflate.c
      - src/infback.c
      - src/inftrees.c
      - src/inffast.c
      - src/trees.c
      - src/uncompr.c
      - src/zutil.c
    include_dirs:
      - include
      - src
    defines:
      - Z_HAVE_UNISTD_H
