project: lua

targets:
  - name: lua
    type: ee_lib
    sources:
      - src/lapi.c
      - src/lcode.c
      - src/lctype.c
      - src/ldebug.c
      - src/ldo.c
      - src/ldump.c
      - src/lfunc.c
      - src/lgc.c
      - src/llex.c
      - src/lmem.c
      - src/lobject.c
      - src/lopcodes.c
      - src/lparser.c
      - src/lstate.c
      - src/lstring.c
      - src/ltable.c
      - src/ltm.c
      - src/lundump.c
      - src/lvm.c
      - src/lzio.c
      - src/ltests.c
      - src/lauxlib.c
      - src/lbaselib.c
      - src/ldblib.c
      - src/liolib.c
      - src/lmathlib.c
      - src/loslib.c
      - src/ltablib.c
      - src/lstrlib.c
      - src/lutf8lib.c
      - src/loadlib.c
      - src/lcorolib.c
      - src/linit.c
    include_dirs:
      - src
    cflags:
      - -std=c99
      - -DLUA_USE_PS2
      - -fno-stack-protector
      - -fno-common

  - name: lua-cli
    type: ee
    sources:
      - src/lua.c
    include_dirs:
      - src
    cflags:
      - -std=c99
      - -DLUA_USE_PS2
      - -fno-stack-protector
      - -fno-common
    libs: [lua]
